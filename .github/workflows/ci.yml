name: Permission-Aware RAG CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/permission_rag_test
      JWT_SECRET_KEY: ci-only-test-secret-not-for-production

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: permission_rag_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d permission_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:v1.19.1
        ports:
          - 6333:6333

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Wait for Qdrant
        run: |
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 \
            http://localhost:6333/

      - name: Initialize PostgreSQL tables
        run: |
          python -c "from src.db.identity_schema import create_identity_tables; from src.db.schema import create_audit_logs_table, create_permission_audit_logs_table; create_identity_tables(); create_audit_logs_table(); create_permission_audit_logs_table(); print('Database tables initialized')"

      - name: Create Qdrant collection
        run: python create_collection.py

      - name: Insert sample documents
        run: python insert_documents.py

      - name: Run test suite
        run: python -m pytest -v
